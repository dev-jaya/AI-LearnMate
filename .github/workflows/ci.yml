name: AI LearnMate CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app tests
      - run: python tests/smoke_tests.py
      - run: python -m pytest -q tests
      - run: python -c "from app.main import app; print(app.title, len(app.routes))"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build

  production_e2e:
    if: github.head_ref == 'verification/live-production-smoke'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Run production HTTP smoke
        env:
          BACKEND_URL: https://ai-learnmate-backend.onrender.com
          FRONTEND_URL: https://ai-learnmate-frontend.onrender.com
          EXPECTED_VERSION: "1.5.0"
        run: python .github/scripts/production_smoke.py
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Playwright
        run: npm install --no-save playwright@latest
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run production browser smoke
        env:
          FRONTEND_URL: https://ai-learnmate-frontend.onrender.com
        run: node .github/scripts/browser_smoke.mjs
